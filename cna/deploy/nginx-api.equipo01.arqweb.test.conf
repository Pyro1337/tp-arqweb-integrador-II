# Server block para api.equipo01.arqweb.test
# Copiar a /etc/nginx/sites-available/api.equipo01.arqweb.test y symlink en sites-enabled

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# Retain only bounded correlation IDs. No URL/query/header contents in access logs.
map $http_x_request_id $cna_request_id {
    default $request_id;
    "~^[A-Za-z0-9._:-]{1,128}$" $http_x_request_id;
}
log_format cna_json escape=json
    '{"service":"gateway","request_id":"$req_id",'
    '"method":"$request_method","status":$status,'
    '"duration":$request_time,"upstream_status":"$upstream_status"}';

upstream search_svc { server 192.168.0.20:8002; }
upstream audit_svc  { server 192.168.0.20:8003; }
upstream export_svc { server 192.168.0.20:8004; }
upstream media_svc  { server 192.168.0.20:8005; }

server {
    listen 80;
    server_name api.equipo01.arqweb.test;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.equipo01.arqweb.test;

    ssl_certificate     /etc/nginx/ssl/equipo01.crt;
    ssl_certificate_key /etc/nginx/ssl/equipo01.key;
    ssl_protocols TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'" always;
    server_tokens off;

    set $req_id $cna_request_id;
    access_log /var/log/nginx/cna-access.json cna_json;
    proxy_set_header X-Request-ID $req_id;
    proxy_set_header traceparent $http_traceparent;
    add_header X-Request-ID $req_id always;

    proxy_connect_timeout 3s;
    proxy_read_timeout 5s;

    limit_req zone=api_limit burst=20 nodelay;
    limit_req_status 429;

    # respuesta 503 uniforme en JSON en vez de la pagina de error de nginx
    error_page 502 503 504 = @service_unavailable;
    location @service_unavailable {
        default_type application/json;
        return 503 '{"error":"service_unavailable","message":"El servicio no esta disponible"}';
    }

    location /v2/search {
        proxy_pass http://search_svc;
    }

    location /v2/audit {
        proxy_pass http://audit_svc;
    }

    location /v2/exports {
        proxy_pass http://export_svc;
    }

    location /v2/media {
        proxy_pass http://media_svc;
        client_max_body_size 10m;
    }
}
