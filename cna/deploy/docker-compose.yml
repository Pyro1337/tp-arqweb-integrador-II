services:
  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - nats-data:/data
    ports:
      - "127.0.0.1:4222:4222"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8222/healthz"]
      interval: 10s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  meilisearch:
    image: getmeili/meilisearch:v1.10
    environment:
      MEILI_MASTER_KEY: ${MEILI_KEY:-masterKey123}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili-data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:7700/health"]
      interval: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  audit-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: ${AUDIT_DB_PASSWORD:-audit}
      POSTGRES_DB: audit
    volumes:
      - audit-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit"]
      interval: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  export-redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M

  minio:
    image: bitnamilegacy/minio:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
    volumes:
      - minio-data:/bitnami/minio/data
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  event-bridge:
    build: ../services/event-bridge
    image: event-bridge:1.0.0
    read_only: true
    restart: unless-stopped
    environment:
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      NATS_URL: nats://nats:4222
    ports:
      - "8001:8000"
    depends_on:
      nats:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M

  search-svc:
    build: ../services/search-svc
    image: search-svc:1.0.0
    read_only: true
    restart: unless-stopped
    environment:
      GITEA_URL: ${GITEA_URL}
      GITEA_TOKEN: ${GITEA_TOKEN}
      MEILI_URL: http://meilisearch:7700
      MEILI_KEY: ${MEILI_KEY:-masterKey123}
      NATS_URL: nats://nats:4222
    ports:
      - "8002:8000"
    depends_on:
      nats:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      event-bridge:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 256M

  audit-svc:
    build: ../services/audit-svc
    image: audit-svc:1.0.0
    read_only: true
    restart: unless-stopped
    environment:
      DB_DSN: postgresql://audit:${AUDIT_DB_PASSWORD:-audit}@audit-db:5432/audit
      NATS_URL: nats://nats:4222
    ports:
      - "8003:8000"
    depends_on:
      nats:
        condition: service_healthy
      audit-db:
        condition: service_healthy
      event-bridge:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 256M

  export-svc:
    build:
      context: ../services/export-svc
      dockerfile: Dockerfile.api
    image: export-svc:1.0.0
    read_only: true
    restart: unless-stopped
    environment:
      REDIS_URL: redis://export-redis:6379/0
    ports:
      - "8004:8000"
    depends_on:
      export-redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M

  export-worker:
    build:
      context: ../services/export-svc
      dockerfile: Dockerfile.worker
    image: export-worker:1.0.0
    read_only: true
    restart: unless-stopped
    environment:
      REDIS_URL: redis://export-redis:6379/0
      GITEA_URL: ${GITEA_URL}
      GITEA_TOKEN: ${GITEA_TOKEN}
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: ${VM2_IP}:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin123}
    depends_on:
      export-redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 256M

  media-svc:
    build: ../services/media-svc
    image: media-svc:1.0.0
    read_only: true
    restart: unless-stopped
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: ${VM2_IP}:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin123}
      NATS_URL: nats://nats:4222
    ports:
      - "8005:8000"
    depends_on:
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  nats-data:
  meili-data:
  audit-db-data:
  redis-data:
  minio-data:
