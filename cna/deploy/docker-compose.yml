services:
  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - nats-data:/data
    ports:
      - "127.0.0.1:4222:4222"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8222/healthz"]
      interval: 10s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  meilisearch:
    image: getmeili/meilisearch:v1.10
    environment:
      MEILI_MASTER_KEY: ${MEILI_KEY:-masterKey123}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili-data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:7700/health"]
      interval: 10s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  audit-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: ${AUDIT_DB_PASSWORD:-audit}
      POSTGRES_DB: audit
    volumes:
      - audit-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit"]
      interval: 10s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  export-redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

  minio:
    image: bitnamilegacy/minio:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
    volumes:
      - minio-data:/bitnami/minio/data
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384M

  event-bridge:
    build: ../services/event-bridge
    image: event-bridge:1.0.0
    read_only: true
    restart: unless-stopped
    environment:
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      NATS_URL: nats://nats:4222
      JAEGER_OTLP_ENDPOINT: jaeger:4317
    ports:
      - "8001:8000"
    depends_on:
      nats:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M

  search-svc:
    build: ../services/search-svc
    image: search-svc:1.0.0
    read_only: true
    restart: unless-stopped
    environment:
      GITEA_URL: ${GITEA_URL}
      GITEA_TOKEN: ${GITEA_TOKEN}
      GITEA_TIMEOUT: ${GITEA_TIMEOUT:-1.5}
      MEILI_URL: http://meilisearch:7700
      MEILI_KEY: ${MEILI_KEY:-masterKey123}
      NATS_URL: nats://nats:4222
      JAEGER_OTLP_ENDPOINT: jaeger:4317
    ports:
      - "8002:8000"
    depends_on:
      nats:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      event-bridge:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 256M

  audit-svc:
    build: ../services/audit-svc
    image: audit-svc:1.0.0
    read_only: true
    restart: unless-stopped
    environment:
      DB_DSN: postgresql://audit:${AUDIT_DB_PASSWORD:-audit}@audit-db:5432/audit
      NATS_URL: nats://nats:4222
      JAEGER_OTLP_ENDPOINT: jaeger:4317
    ports:
      - "8003:8000"
    depends_on:
      nats:
        condition: service_healthy
      audit-db:
        condition: service_healthy
      event-bridge:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 256M

  export-svc:
    build:
      context: ../services/export-svc
      dockerfile: Dockerfile.api
    image: export-svc:1.0.0
    read_only: true
    restart: unless-stopped
    environment:
      REDIS_URL: redis://export-redis:6379/0
    ports:
      - "8004:8000"
    depends_on:
      export-redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M

  export-worker:
    build:
      context: ../services/export-svc
      dockerfile: Dockerfile.worker
    image: export-worker:1.0.0
    read_only: true
    restart: unless-stopped
    environment:
      REDIS_URL: redis://export-redis:6379/0
      GITEA_URL: ${GITEA_URL}
      GITEA_TOKEN: ${GITEA_TOKEN}
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: ${VM2_IP}:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin123}
      EXPORT_WORKER_TEST_DELAY: ${EXPORT_WORKER_TEST_DELAY:-0}
    depends_on:
      export-redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 256M

  media-svc:
    build: ../services/media-svc
    image: media-svc:1.0.0
    read_only: true
    restart: unless-stopped
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: ${VM2_IP}:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin123}
      NATS_URL: nats://nats:4222
    ports:
      - "8005:8000"
    depends_on:
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    restart: unless-stopped
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 150M

  loki:
    image: grafana/loki:3.1.1
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ../observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 150M

  promtail:
    image: grafana/promtail:3.1.1
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ../observability/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    restart: unless-stopped
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          memory: 64M

  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 150M

volumes:
  nats-data:
  meili-data:
  audit-db-data:
  redis-data:
  minio-data:
  prometheus-data:
  grafana-data:
  loki-data:
