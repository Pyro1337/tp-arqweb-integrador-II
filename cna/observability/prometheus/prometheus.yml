global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: event-bridge
    static_configs:
      - targets: ["event-bridge:8000"]

  - job_name: search-svc
    static_configs:
      - targets: ["search-svc:8000"]

  - job_name: audit-svc
    static_configs:
      - targets: ["audit-svc:8000"]

  - job_name: export-svc
    static_configs:
      - targets: ["export-svc:8000"]

  - job_name: media-svc
    static_configs:
      - targets: ["media-svc:8000"]

  - job_name: queue-metrics
    static_configs:
      - targets: ["queue-metrics:8000"]

alerting:
  alertmanagers:
    - static_configs:
        - targets: []
